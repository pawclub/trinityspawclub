<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purr Club | Booking</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Booking Page Custom Styles -->
  <style>
  /* Container and Section */
  .booking-section {
    background: #fafafa; /* soft neutral background */
    padding: 50px 20px;
  }

  .booking-section .container {
    max-width: 700px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    padding: 30px 40px;
    font-family: 'Lato', sans-serif;
  }

  /* Heading */
  .booking-section h3 {
    font-family: 'Poppins', sans-serif;
    color: #4a7c59; /* sage green accent */
    text-align: center;
    margin-bottom: 15px;
    font-size: 28px;
  }

  .booking-section p {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
  }

  /* Form Group */
  .contact-form .form-group {
    margin-bottom: 18px;
  }

  .contact-form label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #333;
  }

  .contact-form input,
  .contact-form select,
  .contact-form textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .contact-form input:focus,
  .contact-form select:focus,
  .contact-form textarea:focus {
    border-color: #4a7c59; /* sage green */
    box-shadow: 0 0 5px rgba(74,124,89,0.3);
    outline: none;
  }

  /* Submit Button */
  .contact-form .btn-secondary {
    display: inline-block;
    width: 100%;
    background: #4a7c59; /* sage green */
    color: #fff;
    border: none;
    padding: 14px 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .contact-form .btn-secondary:hover {
    background: #3c6348; /* darker sage on hover */
  }

  /* Back Home Button */
  .back-home {
    margin-top: 25px;
    text-align: center;
  }

  .back-home a {
    display: inline-block;
    text-decoration: none;
    padding: 12px 25px;
    background: #eee;
    color: #4a7c59;
    border-radius: 10px;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .back-home a:hover {
    background: #4a7c59;
    color: #fff;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .booking-section .container {
      padding: 25px 20px;
    }
  }
  </style>
</head>
<body>
 <nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="booking.html">Booking</a></li>
  </ul>
 </nav>

 <section class="booking-section">
   <div class="container">
     <h3>Book Your Service</h3>
     <p>Please fill out the form below to request a booking.</p>

     <form action="https://formspree.io/f/yourFormID" method="POST" class="contact-form">
       
       <div class="form-group">
         <label for="name">Full Name</label>
         <input type="text" id="name" name="name" required />
       </div>

       <div class="form-group">
         <label for="email">Email Address</label>
         <input type="email" id="email" name="email" required />
       </div>

       <div class="form-group">
         <label for="phone">Phone Number</label>
         <input type="tel" id="phone" name="phone" required />
       </div>

       <div class="form-group">
         <label for="service">Select a Service</label>
         <select id="service" name="service" required>
           <option value="">-- Please choose an option --</option>
           <option value="drop-in">Drop-In Visits</option>
           <option value="daycare">Daycare</option>
           <option value="overnight">Overnight Stay</option>
           <option value="walking">Dog Walking</option>
           <option value="consultation">Consultation</option>
         </select>
       </div>

       <div class="form-group">
         <label for="pet">Type of Pet</label>
         <select id="pet" name="pet" required>
           <option value="">-- Select pet type --</option>
           <option value="dog">Dog</option>
           <option value="cat">Cat</option>
           <option value="other">Other</option>
         </select>
       </div>

       <div class="form-group">
         <label for="dates">Select Date(s)</label>
         <input type="date" id="dates" name="dates[]" multiple required />
       </div>

       <div class="form-group">
         <label for="details">Additional Details</label>
         <textarea id="details" name="details" rows="4"></textarea>
       </div>

       <!-- Redirect after submission -->
       <input type="hidden" name="_redirect" value="https://yourwebsite.com/thankyou.html">

       <button type="submit" class="btn-secondary">Submit Booking</button>
     </form>

     <div class="back-home">
       <a href="index.html">← Back to Home</a>
     </div>
   </div>
 </section>
</body>
</html>
