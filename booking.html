<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purr Club | Booking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 <nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="services/services.html">Services</a></li>
    <li><a href="about/about.html">About</a></li>
    <li><a href="booking/booking.html">Booking</a></li>
    <li><a href="testimonials/testimonials.html">Testimonials</a></li>
    <li><a href="contact/contact.html">Contact</a></li>
  </ul>
</nav>
  <main>
  <section class="section booking-section">
    <div class="container">
      <h3>Book a Service</h3>
      <form action="https://formspree.io/f/yourFormID" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Your Name:</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Your Email:</label>
          <input type="email" id="email" name="_replyto" required />
        </div>

        <div class="form-group">
          <label for="date">Preferred Date:</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="form-group">
          <label for="time">Preferred Time:</label>
          <input type="time" id="time" name="time" required />
        </div>

        <div class="form-group">
          <label for="pet-type">Pet Type:</label>
          <input type="text" id="pet-type" name="pet-type" placeholder="Dog, cat, etc." required />
        </div>

        <div class="form-group">
          <label for="service">Service:</label>
          <select id="service" name="service" required>
            <option value="" disabled selected>Select a service</option>
            <option value="Drop-In Visit">Drop-In Visit</option>
            <option value="Daycare">Daycare</option>
            <option value="Overnight Care">Overnight Care</option>
            <option value="Dog Walking">Dog Walking</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="notes">Additional Notes:</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Tell me anything special about your pet or needs."></textarea>
        </div>

        <!-- Redirect after submission -->
        <input type="hidden" name="_redirect" value="https://pawclub.github.io/trinityspawclub/thankyou.html" />
        <input type="text" name="_gotcha" style="display:none" />

        <button type="submit" class="btn-secondary">Submit Booking</button>
      </form>

      <div class="back-home">
        <a href="index.html" class="btn-secondary">← Back to Home</a>
      </div>
    </div>
  </section>
  </main>
</body>
</html>
