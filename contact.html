<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Me</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Lato&display=swap" rel="stylesheet">

  <!-- Link to external stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="section contact-section">
    <div class="container">
      <h3>Contact Me</h3>
      <form action="https://formspree.io/f/xzzgznwp" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="_replyto" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="1234567890" />
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <!-- Redirect after submission -->
        <input type="hidden" name="_redirect" value="https://pawclub.github.io/trinityspawclub/thankyou.html" />
        <input type="text" name="_gotcha" style="display:none" />

        <button type="submit" class="btn-secondary">Send Message</button>
      </form>
    </div>
    <div class="back-home">
      <a href="index.html" class="btn-secondary">← Back to Home</a>
    </div>
  </section>
</body>
</html>
