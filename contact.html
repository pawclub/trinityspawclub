<section class="section contact-section">
  <div class="container">
    <h3>Contact Me</h3>
    <form action="https://formsubmit.co/your-email@example.com" method="POST" class="contact-form">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="1234567890" />
      </div>

      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <!-- Optional: Thank you redirect -->
      <input type="hidden" name="_next" value="https://yourdomain.com/thank-you.html" />
      <input type="hidden" name="_captcha" value="false" />

      <button type="submit" class="btn-secondary">Send Message</button>
    </form>
  </div>
</section>
